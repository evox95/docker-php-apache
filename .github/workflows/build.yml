name: Publish Docker images

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # weekly rebuild picks up new Sury and Debian security updates
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  IMAGE: evox95/php
  # only master publishes; any other ref (PRs, manual runs on a branch) only builds and tests
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

# Publishing runs are queued, never run side by side. Everything else gets its
# own group per ref, so it cannot replace a pending publishing run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.3" ]
        platform: [ "linux/amd64", "linux/arm64" ]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      # One build, two exports: the local image that gets tested and, when
      # publishing, the same image pushed untagged by digest. Only the merge
      # job, which runs after every test passed, puts tags on it.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          provenance: false
          build-args: PHP_VERSION=${{ matrix.php }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=docker,name=test/php:${{ matrix.php }}-apache
            ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
      - name: Test
        run: tests/run.sh test/php:${{ matrix.php }}-apache
      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          METADATA: ${{ steps.build.outputs.metadata }}
          TAG: test/php:${{ matrix.php }}-apache
        run: |
          # The pushed manifest must be the image that was just tested. The
          # local image ID is the config digest with the classic image store
          # and the manifest digest with the containerd one.
          config="$(jq -r '."containerimage.config.digest"' <<< "$METADATA")"
          id="$(docker image inspect --format '{{.Id}}' "$TAG")"
          [ "$id" = "$config" ] || [ "$id" = "$DIGEST" ] \
            || { echo "::error::tested image $id is not the pushed one (manifest $DIGEST, config $config)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.php }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish PHP ${{ matrix.php }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ "7.3" ]
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.php }}-*
          merge-multiple: true
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A re-run of an old workflow must not move the rolling tags back to an
      # older revision; it still gets its own run tag.
      - name: Check revision is current
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)"
          echo "current=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.php }}-apache,enable=${{ steps.fresh.outputs.current }}
            type=raw,value=${{ matrix.php }}-apache-trixie,enable=${{ steps.fresh.outputs.current }}
            type=raw,value=${{ matrix.php }}-apache-{{date 'YYYYMMDD'}}-${{ github.run_id }}.${{ github.run_attempt }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          test "$#" -eq 2
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${@/#/$IMAGE@sha256:}"
      - name: Inspect image
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
